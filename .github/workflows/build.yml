name: Build EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller openpyxl

      - name: 打包成 exe
        run: pyinstaller -F -w -n 报关自动化工具 single.py

      - name: 发布到 Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: 报关自动化工具 v1.0.0
          files: dist/报关自动化工具.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
