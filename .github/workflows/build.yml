name: Build EXE

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 升级 pip 并安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller openpyxl xlrd

      - name: 打包成 exe（单文件 / 无黑框 / 64位）
        run: pyinstaller -F -w -n 报关自动化工具 single.py

      - name: 发布到 Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.9
          name: 报关自动化工具 v1.0.9（税额=金额×税率）
          files: dist/报关自动化工具.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
